spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB_ORDER}?rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

    hikari:
      maximum-pool-size: ${ORDER_SERVICE_POOL_MAX_SIZE}

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL-AUTO}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
    defer-datasource-initialization: true
    open-in-view: false

  batch:
    jdbc:
      initialize-schema: ${BATCH_JDBC_INITIALIZE_SCHEMA}
      platform: mysql
    job:
      enabled: true

  sql:
    init:
      mode: ${SQL_INIT_MODE}
      data-locations: classpath:data.sql

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      batch-size: 16384                  # 16KB
      buffer-memory: 33554432            # 32MB
      compression-type: snappy
      properties:
        enable.idempotence: true
        partitioner.class: org.apache.kafka.clients.producer.RoundRobinPartitioner
        max.in.flight.requests.per.connection: 5
        linger.ms: 10
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000

api:
  internal:
    catalog-service:
      url: http://${CATALOG_HOST}:${CATALOG_PORT}/client
    inventory-service:
      url: http://${INVENTORY_HOST}:${INVENTORY_PORT}/${INVENTORY_URI_PREFIX}
    payment-service:
      url: http://${PAYMENT_HOST}:${PAYMENT_PORT}/client

logging:
  level:
    root: WARN
    io.playground: ERROR

    org.springframework.jdbc.core: ERROR
    org.springframework.jdbc.core.StatementCreatorUtils: ERROR

    org.hibernate.SQL: ERROR
    org.hibernate.orm.jdbc.bind: ERROR

    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
